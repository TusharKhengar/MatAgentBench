[project]
name = "matagentbench"
version = "0.1.0"
description = "A verifiable benchmark and counterfactual failure-attribution harness for LLM agents running atomistic materials workflows."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Khengar Tushar" }]
keywords = ["agents", "benchmark", "materials-science", "evaluation", "rl-environment"]

dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Structure retrieval + ground truth. Needed to generate tasks.
data = [
    "pymatgen>=2024.5.1",
    "mp-api>=0.41",
]
# ML interatomic potentials. Needed to run/verify workflows.
sim = [
    "chgnet>=0.3.8",
    "ase>=3.23",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
]
all = ["matagentbench[data,sim,dev]"]

[project.scripts]
mab = "matagentbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matagentbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # Typer's entire API is `def cmd(x: T = typer.Option(...))`. B008 forbids exactly
    # that idiom, and working around it would make the CLI harder to read.
    "B008",
    # `class Foo(str, Enum)` is deliberate: it keeps enum members JSON-serialisable and
    # comparable to the raw strings stored in results files. StrEnum would drop 3.10.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Fixture data reads better as wide literal rows than as wrapped ones.
"scripts/make_fixture_results.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
